
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="/style.css" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <header>
            <img src="/Logo.png" alt="School Logo" id="sidebar-logo">
            <h3 id="sidebar-school-name">NATIONAL MODEL SCHOOL</h3>
        </header>
        <nav>
            <a href="#dashboard" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="#students"><i class="fas fa-user-graduate"></i> Students</a>
            <a href="#teachers"><i class="fas fa-chalkboard-teacher"></i> Teachers</a>
            <a href="#accounts"><i class="fas fa-file-invoice-dollar"></i> Accounts</a>
            <a href="#attendance"><i class="fas fa-calendar-check"></i> Attendance</a>
            <a href="#examination"><i class="fas fa-clipboard-list"></i> Examination</a>
        </nav>
    </div>
    <div class="main-content">
        <main>
            <section id="dashboard">
            </section>
            <section id="students" style="display: none;">
            </section>
            <section id="teachers" style="display: none;">
            </section>
            <section id="accounts" style="display: none;">
            </section>
            <section id="attendance" style="display: none;">
            </section>
            <section id="examination" style="display: none;">
            </section>
        </main>
    </div>

    <div id="modal-container"></div>

    <script>
        let db;

        function loadData() {
            return fetch('/database.json')
                .then(response => response.json())
                .then(data => {
                    db = data;
                    localStorage.setItem('schoolDB', JSON.stringify(db));
                });
        }

        function saveData() {
            return fetch('/update-database', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(db),
            })
            .then(response => response.text())
            .then(data => {
                console.log(data);
                localStorage.setItem('schoolDB', JSON.stringify(db));
                renderContent(window.location.hash || '#dashboard');
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }

        function navigate(hash) {
            document.querySelectorAll('main > section').forEach(s => s.style.display = 'none');
            const section = document.querySelector(hash);
            if (section) {
                section.style.display = 'block';
                renderContent(hash);
            }
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            const activeLink = document.querySelector('nav a[href="' + hash + '"]');
            if(activeLink){
                activeLink.classList.add('active');
            }
        }
        
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablink");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }
        
        function renderContent(hash) {
            switch(hash) {
                case '#dashboard':
                    renderDashboard();
                    break;
                case '#students':
                    renderStudents();
                    break;
                case '#teachers':
                    renderTeachers();
                    break;
                case '#accounts':
                    renderAccounts();
                    break;
                case '#attendance':
                    renderAttendance();
                    break;
                case '#examination':
                    renderExamination();
                    break;
            }
        }

        function renderDashboard() {
            const dashboardContent = document.getElementById('dashboard');
            const totalFees = (db.fees || []).reduce((sum, fee) => sum + fee.amount, 0);
            const totalExpenses = (db.expenditures || []).reduce((sum, exp) => sum + exp.amount, 0);
            const totalSalaries = (db.salaries || []).reduce((sum, sal) => sum + sal.amount, 0);

            dashboardContent.innerHTML = `
                <h2>Welcome to your Dashboard</h2>
                <div class="dashboard-grid">
                    <div class="card">
                        <i class="fas fa-user-graduate"></i>
                        <h3>Total Students</h3>
                        <p>${(db.students || []).length}</p>
                    </div>
                    <div class="card">
                        <i class="fas fa-chalkboard-teacher"></i>
                        <h3>Total Teachers</h3>
                        <p>${(db.teachers || []).length}</p>
                    </div>
                    <div class="card">
                        <i class="fas fa-dollar-sign"></i>
                        <h3>Total Fees Collected</h3>
                        <p>Rs. ${totalFees}</p>
                    </div>
                    <div class="card">
                        <i class="fas fa-wallet"></i>
                        <h3>Total Expenses</h3>
                        <p>Rs. ${totalExpenses + totalSalaries}</p>
                    </div>
                </div>
            `;
        }

        function renderStudents() {
    const studentsContent = document.getElementById('students');
    let tableHtml = `
        <div class="section-header">
            <h2>Students</h2>
            <button id="add-student-btn" class="btn btn-primary"><i class="fas fa-plus"></i> Add Student</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Roll No.</th>
                    <th>Father</th>
                    <th>Contact</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>`;

    for (const [index, student] of (db.students || []).entries()) {
        const imageSrc = student.image ? `<img src="${student.image}" alt="${student.name}" class="table-image">` : 'No Image';
        tableHtml += `
            <tr>
                <td>${imageSrc}</td>
                <td>${student.name}</td>
                <td>${student.class}</td>
                <td>${student.roll}</td>
                <td>${student.father}</td>
                <td>${student.contact}</td>
                <td>
                    <button class="btn btn-sm btn-info view-student-btn" data-index="${index}"><i class="fas fa-eye"></i></button>
                    <button class="btn btn-sm btn-warning edit-student-btn" data-index="${index}"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-sm btn-danger delete-student-btn" data-index="${index}"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
    }

    tableHtml += '</tbody></table>';
    studentsContent.innerHTML = tableHtml;

    document.getElementById('add-student-btn').addEventListener('click', () => openStudentModal());
    document.querySelectorAll('.edit-student-btn').forEach(btn => btn.addEventListener('click', (e) => openStudentModal(e.currentTarget.dataset.index)));
    document.querySelectorAll('.delete-student-btn').forEach(btn => btn.addEventListener('click', (e) => deleteStudent(e.currentTarget.dataset.index)));
    document.querySelectorAll('.view-student-btn').forEach(btn => btn.addEventListener('click', (e) => openStudentViewModal(e.currentTarget.dataset.index)));
}

function openStudentModal(index) {
    const modalContainer = document.getElementById('modal-container');
    const student = index !== undefined ? db.students[index] : {};
    const modalHtml = `
        <div class="modal" id="student-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3><i class="fas fa-user-plus"></i> ${index !== undefined ? 'Edit' : 'Add'} Student</h3>
                    <span class="close-button">&times;</span>
                </div>
                <form id="student-form">
                    <input type="hidden" id="student-index" value="${index || ''}">
                    <div class="profile-pic-container">
                        <img id="profile-pic-preview" src="${student.image || 'https://via.placeholder.com/150'}" alt="Profile Picture">
                        <input type="file" id="student-image" accept="image/*">
                        <label for="student-image" class="upload-label"><i class="fas fa-camera"></i></label>
                    </div>
                    <div class="form-grid-new">
                        <div class="form-field">
                            <label for="student-name">Full Name *</label>
                            <input type="text" id="student-name" placeholder="Full Name" value="${student.name || ''}" required>
                        </div>
                        <div class="form-field">
                            <label for="student-father">Father's Name</label>
                            <input type="text" id="student-father" placeholder="Father's Name" value="${student.father || ''}">
                        </div>
                        <div class="form-field">
                            <label for="student-class">Class *</label>
                            <select id="student-class" required>
                                <option value="">Select Class</option>
                                ${[...Array(10).keys()].map(i => `<option value="${i+1}" ${student.class == (i+1) ? 'selected' : ''}>Class ${i+1}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="student-roll">Roll Number (Auto) *</label>
                            <input type="text" id="student-roll" placeholder="Select Class First" value="${student.roll || ''}" readonly>
                        </div>
                        <div class="form-field">
                            <label for="student-admission-date">Admission Date</label>
                            <input type="date" id="student-admission-date" value="${student.admissionDate || new Date().toISOString().slice(0, 10)}">
                        </div>
                        <div class="form-field">
                            <label for="student-contact">Contact Phone (Format: 923...)</label>
                            <input type="text" id="student-contact" placeholder="Contact Phone" value="${student.contact || ''}">
                        </div>
                        <div class="form-field full-width">
                            <label for="student-address">Full Address</label>
                            <input type="text" id="student-address" placeholder="Full Address" value="${student.address || ''}">
                        </div>
                        <div class="form-field">
                            <label for="student-admission-fee">Admission Fee (Rs) *</label>
                            <input type="number" id="student-admission-fee" placeholder="Admission Fee" value="${student.admissionFee || ''}" required>
                        </div>
                        <div class="form-field">
                            <label for="student-admission-fee-status">Admission Fee Status *</label>
                            <select id="student-admission-fee-status" required>
                                <option value="Paid" ${student.admissionFeeStatus === 'Paid' ? 'selected' : ''}>Paid</option>
                                <option value="Unpaid" ${student.admissionFeeStatus === 'Unpaid' ? 'selected' : ''}>Unpaid</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="student-monthly-fee">Monthly Fee (Rs) *</label>
                            <input type="number" id="student-monthly-fee" placeholder="Monthly Fee" value="${student.monthlyFee || ''}" required>
                        </div>
                    </div>
                    <div class="form-actions">
                         <button type="submit" class="btn btn-primary">Save Student</button>
                    </div>
                </form>
            </div>
        </div>`;
    modalContainer.innerHTML = modalHtml;
    const modal = document.getElementById('student-modal');
    modal.style.display = 'block';
    document.querySelector('.close-button').addEventListener('click', () => modal.style.display = 'none');
    document.getElementById('student-form').addEventListener('submit', saveStudent);

    document.getElementById('student-image').addEventListener('change', function(){
        const [file] = this.files;
        if (file) {
            document.getElementById('profile-pic-preview').src = URL.createObjectURL(file);
        }
    });

    document.getElementById('student-class').addEventListener('change', (e) => {
        const selectedClass = e.target.value;
        if (selectedClass && !document.getElementById('student-index').value) { // Only auto-generate for new students
            const studentsInClass = (db.students || []).filter(s => s.class === selectedClass);
            const lastRoll = studentsInClass.reduce((max, s) => {
                const rollParts = s.roll.split('-');
                const rollNum = parseInt(rollParts[rollParts.length - 1]);
                return rollNum > max ? rollNum : max;
            }, 0);
            const newRoll = `NMS-${selectedClass}-${lastRoll + 1}`;
            document.getElementById('student-roll').value = newRoll;
        }
    });
}

function saveStudent(e) {
    e.preventDefault();
    const index = document.getElementById('student-index').value;
    const imageInput = document.getElementById('student-image');
    const imageFile = imageInput.files[0];

    const studentData = {
        name: document.getElementById('student-name').value,
        class: document.getElementById('student-class').value,
        roll: document.getElementById('student-roll').value,
        father: document.getElementById('student-father').value,
        contact: document.getElementById('student-contact').value,
        address: document.getElementById('student-address').value,
        admissionDate: document.getElementById('student-admission-date').value,
        admissionFee: document.getElementById('student-admission-fee').value,
        admissionFeeStatus: document.getElementById('student-admission-fee-status').value,
        monthlyFee: document.getElementById('student-monthly-fee').value,
        image: (index !== "" && db.students[index]) ? db.students[index].image : ''
    };

    const processAndSave = () => {
        if (index === "") {
            if (!db.students) db.students = [];
            db.students.push(studentData);
        } else {
            db.students[index] = studentData;
        }
        saveData();
        document.getElementById('student-modal').style.display = 'none';
    };

    if (imageFile) {
        const reader = new FileReader();
        reader.onload = (e) => {
            studentData.image = e.target.result;
            processAndSave();
        };
        reader.readAsDataURL(imageFile);
    } else {
        processAndSave();
    }
}

function openStudentViewModal(index) {
    const student = db.students[index];
    const modalContainer = document.getElementById('modal-container');
    const modalHtml = `
        <div class="modal" id="student-view-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3><i class="fas fa-user-graduate"></i> Student Details</h3>
                    <span class="close-button">&times;</span>
                </div>
                <div class="student-view-content">
                    <div class="student-view-profile">
                        <img src="${student.image || 'https://via.placeholder.com/150'}" alt="Student Photo">
                        <h3>${student.name}</h3>
                        <p>Class: ${student.class} | Roll No: ${student.roll}</p>
                    </div>
                    <div class="student-view-details">
                        <div class="detail-item"><span>Father's Name:</span> ${student.father}</div>
                        <div class="detail-item"><span>Contact:</span> ${student.contact}</div>
                        <div class="detail-item"><span>Address:</span> ${student.address}</div>
                        <div class="detail-item"><span>Admission Date:</span> ${student.admissionDate}</div>
                        <div class="detail-item"><span>Admission Fee:</span> Rs. ${student.admissionFee} (${student.admissionFeeStatus})</div>
                        <div class="detail-item"><span>Monthly Fee:</span> Rs. ${student.monthlyFee}</div>
                    </div>
                </div>
            </div>
        </div>`;
    modalContainer.innerHTML = modalHtml;
    const modal = document.getElementById('student-view-modal');
    modal.style.display = 'block';
    document.querySelector('#student-view-modal .close-button').addEventListener('click', () => modal.style.display = 'none');
}

        function deleteStudent(index) {
            if (confirm('Are you sure you want to delete this student?')) {
                db.students.splice(index, 1);
                saveData();
            }
        }

        function openIdCardModal(index) {
            const student = db.students[index];
            const modalContainer = document.getElementById('modal-container');
            const modalHtml = `
                <div class="modal" id="id-card-modal">
                    <div class="modal-content">
                        <span class="close-button">&times;</span>
                        <div id="id-card">
                            <div class="id-card-header">
                                <img src="/Logo.png" alt="School Logo" class="id-logo">
                                <h2>NATIONAL MODEL SCHOOL</h2>
                                <span>Student Identity Card</span>
                            </div>
                            <div class="id-card-main">
                                <img src="${student.image || ''}" alt="Student" class="student-photo">
                                <div class="id-card-info">
                                    <div class="info-field">
                                        <span class="field-label">Name</span>
                                        <span class="field-value">${student.name}</span>
                                    </div>
                                    <div class="info-field">
                                        <span class="field-label">Class</span>
                                        <span class="field-value">${student.class}</span>
                                    </div>
                                    <div class="info-field">
                                        <span class="field-label">Roll No.</span>
                                        <span class="field-value">${student.roll}</span>
                                    </div>
                                     <div class="info-field">
                                        <span class="field-label">Father's Name</span>
                                        <span class="field-value">${student.father}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="id-card-footer">
                                <p><strong>Address:</strong> ${student.address}</p>
                                <p><strong>Contact:</strong> ${student.contact}</p>
                            </div>
                        </div>
                        <button id="print-id-card" class="btn btn-primary">Print</button>
                    </div>
                </div>`;
            modalContainer.innerHTML = modalHtml;
            const modal = document.getElementById('id-card-modal');
            modal.style.display = 'block';
            document.querySelector('#id-card-modal .close-button').addEventListener('click', () => modal.style.display = 'none');
            document.getElementById('print-id-card').addEventListener('click', () => printIdCard());
        }

        function printIdCard() {
            const printContent = document.getElementById('id-card').innerHTML;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`<html><head><title>Print ID Card</title><link rel="stylesheet" href="/style.css"></head><body>${printContent}</body></html>`);
            printWindow.document.close();
            printWindow.print();
        }

        function renderTeachers() {
            const teachersContent = document.getElementById('teachers');
            let tableHtml = `
                <div class="section-header">
                    <h2>Teachers</h2>
                    <button id="add-teacher-btn" class="btn btn-primary"><i class="fas fa-plus"></i> Add Teacher</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Subject</th>
                            <th>Contact</th>
                            <th>Address</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>`;

            for (const [index, teacher] of (db.teachers || []).entries()) {
                const imageSrc = teacher.image ? `<img src="${teacher.image}" alt="${teacher.name}" class="table-image">` : 'No Image';
                tableHtml += `
                    <tr>
                        <td>${imageSrc}</td>
                        <td>${teacher.name}</td>
                        <td>${teacher.subject}</td>
                        <td>${teacher.contact}</td>
                        <td>${teacher.address}</td>
                        <td>
                            <button class="btn btn-sm btn-info teacher-id-card-btn" data-index="${index}"><i class="fas fa-id-card"></i></button>
                            <button class="btn btn-sm btn-warning edit-teacher-btn" data-index="${index}"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-danger delete-teacher-btn" data-index="${index}"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            }

            tableHtml += '</tbody></table>';
            teachersContent.innerHTML = tableHtml;

            document.getElementById('add-teacher-btn').addEventListener('click', () => openTeacherModal());
            document.querySelectorAll('.edit-teacher-btn').forEach(btn => btn.addEventListener('click', (e) => openTeacherModal(e.currentTarget.dataset.index)));
            document.querySelectorAll('.delete-teacher-btn').forEach(btn => btn.addEventListener('click', (e) => deleteTeacher(e.currentTarget.dataset.index)));
            document.querySelectorAll('.teacher-id-card-btn').forEach(btn => btn.addEventListener('click', (e) => openTeacherIdCardModal(e.currentTarget.dataset.index)));
        }

        function openTeacherModal(index) {
            const modalContainer = document.getElementById('modal-container');
            const teacher = index !== undefined ? db.teachers[index] : {};
            const modalHtml = `
                <div class="modal" id="teacher-modal">
                    <div class="modal-content">
                        <span class="close-button">&times;</span>
                        <h3>${index !== undefined ? 'Edit' : 'Add'} Teacher</h3>
                        <form id="teacher-form">
                            <input type="hidden" id="teacher-index" value="${index || ''}">
                            <div class="form-grid">
                                <input type="text" id="teacher-name" placeholder="Name" value="${teacher.name || ''}" required>
                                <input type="text" id="teacher-subject" placeholder="Subject" value="${teacher.subject || ''}" required>
                                <input type="text" id="teacher-contact" placeholder="Contact Number" value="${teacher.contact || ''}" required>
                                <input type="text" id="teacher-address" placeholder="Address" value="${teacher.address || ''}" required>
                                <input type="file" id="teacher-image" accept="image/*">
                            </div>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </form>
                    </div>
                </div>`;
            modalContainer.innerHTML = modalHtml;
            const modal = document.getElementById('teacher-modal');
            modal.style.display = 'block';
            document.querySelector('#teacher-modal .close-button').addEventListener('click', () => modal.style.display = 'none');
            document.getElementById('teacher-form').addEventListener('submit', saveTeacher);
        }

        function saveTeacher(e) {
            e.preventDefault();
            const index = document.getElementById('teacher-index').value;
            const imageInput = document.getElementById('teacher-image');
            const imageFile = imageInput.files[0];

            const teacherData = {
                name: document.getElementById('teacher-name').value,
                subject: document.getElementById('teacher-subject').value,
                contact: document.getElementById('teacher-contact').value,
                address: document.getElementById('teacher-address').value,
                image: (index && db.teachers[index]) ? db.teachers[index].image : ''
            };

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    teacherData.image = e.target.result;
                    if (index) {
                        db.teachers[index] = teacherData;
                    } else {
                        if (!db.teachers) db.teachers = [];
                        db.teachers.push(teacherData);
                    }
                    saveData();
                    const modal = document.getElementById('teacher-modal');
                    if(modal) modal.style.display = 'none';
                };
                reader.readAsDataURL(imageFile);
            } else {
                if (index) {
                    db.teachers[index] = teacherData;
                } else {
                    if (!db.teachers) db.teachers = [];
                    db.teachers.push(teacherData);
                }
                saveData();
                const modal = document.getElementById('teacher-modal');
                if(modal) modal.style.display = 'none';
            }
        }

        function deleteTeacher(index) {
            if (confirm('Are you sure you want to delete this teacher?')) {
                db.teachers.splice(index, 1);
                saveData();
            }
        }

        function openTeacherIdCardModal(index) {
            const teacher = db.teachers[index];
            const modalContainer = document.getElementById('modal-container');
            const modalHtml = `
                <div class="modal" id="teacher-id-card-modal">
                    <div class="modal-content">
                        <span class="close-button">&times;</span>
                        <div id="teacher-id-card">
                             <div class="id-card-header">
                                <img src="/Logo.png" alt="School Logo" class="id-logo">
                                <h2>NATIONAL MODEL SCHOOL</h2>
                                <span>Teacher Identity Card</span>
                            </div>
                            <div class="id-card-main">
                                <img src="${teacher.image || ''}" alt="Teacher" class="student-photo">
                                <div class="id-card-info">
                                    <div class="info-field">
                                        <span class="field-label">Name</span>
                                        <span class="field-value">${teacher.name}</span>
                                    </div>
                                    <div class="info-field">
                                        <span class="field-label">Subject</span>
                                        <span class="field-value">${teacher.subject}</span>
                                    </div>
                                    <div class="info-field">
                                        <span class="field-label">Contact</span>
                                        <span class="field-value">${teacher.contact}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="id-card-footer">
                                <p><strong>Address:</strong> ${teacher.address}</p>
                            </div>
                        </div>
                        <button id="print-teacher-id-card" class="btn btn-primary">Print</button>
                    </div>
                </div>`;
            modalContainer.innerHTML = modalHtml;
            const modal = document.getElementById('teacher-id-card-modal');
            modal.style.display = 'block';
            document.querySelector('#teacher-id-card-modal .close-button').addEventListener('click', () => modal.style.display = 'none');
            document.getElementById('print-teacher-id-card').addEventListener('click', () => printTeacherIdCard());
        }

        function printTeacherIdCard() {
            const printContent = document.getElementById('teacher-id-card').innerHTML;
            const printWindow = window.open('', '_blank');

        function renderFees() {
            const feesContent = document.getElementById('fees');
            let tableHtml = `
                <div class="section-header"><h3>Fee Management</h3></div>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Father's Name</th>

                            <th>Fee Status</th>

        function openFeeModal(studentIndex) {
            const student = db.students[studentIndex];
            const modalContainer = document.getElementById('modal-container');
            const modalHtml = `
                <div class="modal" id="fee-modal">

                        <span class="close-button">&times;</span>

                        <form id="fee-form">

        function collectFee(e) {
            e.preventDefault();
            const newFee = {
                roll: document.getElementById('fee-student-roll').value,

        function renderExpenses() {

    let tableHtml = `

            <button id="add-expense-btn" class="btn btn-primary"><i class="fas fa-plus"></i> Add Expense</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Amount</th>

function openExpenseModal(index) {
    const expense = index !== undefined ? db.expenditures[index] : {};
    const modalContainer = document.getElementById('modal-container');
    const modalHtml = `
        <div class="modal" id="expense-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>${index !== undefined ? 'Edit' : 'Add'} Expense</h3>
                    <span class="close-button">&times;</span>
                </div>
                <form id="expense-form" style="padding: 20px;">
                    <input type="hidden" id="expense-index" value="${index || ''}">
                    <div class="form-grid">
                        <input type="text" id="expense-description" placeholder="Description" value="${expense.description || ''}" required>
                        <input type="number" id="expense-amount" placeholder="Amount" value="${expense.amount || ''}" required>
                        <input type="date" id="expense-date" value="${expense.date || new Date().toISOString().slice(0, 10)}" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>`;
    modalContainer.innerHTML = modalHtml;
    const modal = document.getElementById('expense-modal');
    modal.style.display = 'block';
    document.querySelector('#expense-modal .close-button').addEventListener('click', () => modal.style.display = 'none');
    document.getElementById('expense-form').addEventListener('submit', saveExpense);
}

function saveExpense(e) {
    e.preventDefault();
    const index = document.getElementById('expense-index').value;
    const expenseData = {
        description: document.getElementById('expense-description').value,
        amount: parseFloat(document.getElementById('expense-amount').value),
        date: document.getElementById('expense-date').value
    };
    if (index) {
        db.expenditures[index] = expenseData;
    } else {
        if (!db.expenditures) db.expenditures = [];
        db.expenditures.push(expenseData);
    }
    saveData();
    document.getElementById('expense-modal').style.display = 'none';
}

function deleteExpense(index) {
    if (confirm('Are you sure you want to delete this expense?')) {
        db.expenditures.splice(index, 1);
        saveData();
    }
}

function renderSalaries() {
    const salariesContent = document.getElementById('salaries');
    let tableHtml = `
        <div class="section-header">
            <h3>Salary Management</h3>
            <button id="add-salary-btn" class="btn btn-primary"><i class="fas fa-plus"></i> Pay Salary</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Teacher Name</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Action</th>

            <tbody>`;

        const teacher = (db.teachers || []).find(t => t.id === salary.teacherId) || {name: 'Unknown'} ;
        tableHtml += `
            <tr>

function openSalaryModal(index) {
    const salary = index !== undefined ? db.salaries[index] : {};
    const modalContainer = document.getElementById('modal-container');
    let teacherOptions = (db.teachers || []).map((teacher, i) => `<option value="${teacher.id || i}" ${ (salary.teacherId == (teacher.id || i)) ? 'selected' : ''}>${teacher.name}</option>`).join('');
    const modalHtml = `
        <div class="modal" id="salary-modal">
            <div class="modal-content">
                 <div class="modal-header">

                <form id="salary-form" style="padding: 20px;">
                    <input type="hidden" id="salary-index" value="${index || ''}">
                    <div class="form-grid">
                        <select id="salary-teacher-id" required>${teacherOptions}</select>
                        <input type="number" id="salary-amount" placeholder="Amount" value="${salary.amount || ''}" required>
                        <input type="date" id="salary-date" value="${salary.date || new Date().toISOString().slice(0, 10)}" required>

                    <button type="submit" class="btn btn-primary">Save</button>

    modal.style.display = 'block';

    document.getElementById('salary-form').addEventListener('submit', saveSalary);
}

function saveSalary(e) {
    e.preventDefault();
    const index = document.getElementById('salary-index').value;
    const salaryData = {
        teacherId: document.getElementById('salary-teacher-id').value,
        amount: parseFloat(document.getElementById('salary-amount').value),
        date: document.getElementById('salary-date').value
    };

        db.salaries[index] = salaryData;
    } else {
        if (!db.salaries) db.salaries = [];
        db.salaries.push(salaryData);

    document.getElementById('salary-modal').style.display = 'none';
}

function deleteSalary(index) {
    if (confirm('Are you sure you want to delete this salary payment?')) {
        db.salaries.splice(index, 1);
        saveData();
    }
}

        function renderBalanceSheet() {
            const balanceSheetContainer = document.getElementById('balance');
            const totalIncome = (db.fees || []).reduce((sum, fee) => sum + fee.amount, 0);
            const totalExpenditures = (db.expenditures || []).reduce((sum, exp) => sum + exp.amount, 0);
            const totalSalaries = (db.salaries || []).reduce((sum, sal) => sum + sal.amount, 0);
            const totalExpenses = totalExpenditures + totalSalaries;
            const netBalance = totalIncome - totalExpenses;

            balanceSheetContainer.innerHTML = `
                <h3>Balance Sheet</h3>
                <div class="balance-sheet">
                    <div class="balance-sheet-summary">
                        <div class="summary-row"><strong>Total Income:</strong> <span>Rs. ${totalIncome}</span></div>
                        <div class="summary-row"><strong>Total Expenses:</strong> <span>Rs. ${totalExpenses}</span></div>
                        <div class="summary-row net-balance"><strong>Net Balance:</strong> <span>Rs. ${netBalance}</span></div>
                    </div>
                </div>
            `;
        }

        function renderAttendance() {
            const attendanceContent = document.getElementById('attendance');
            const today = new Date().toISOString().slice(0, 10);
            let content = `
                <div class="section-header">
                    <h2>Attendance</h2>
                    <div class="attendance-filters">
                        <input type="date" id="attendance-date" value="${today}">
                        <select id="attendance-class-filter"></select>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Roll No.</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-table-body"></tbody>
                </table>`;
            attendanceContent.innerHTML = content;
            populateClassFilter();
            renderAttendanceTable();

            document.getElementById('attendance-date').addEventListener('change', renderAttendanceTable);
            document.getElementById('attendance-class-filter').addEventListener('change', renderAttendanceTable);
            document.getElementById('attendance-table-body').addEventListener('click', markAttendance);
        }
        
        function populateClassFilter() {
            const classFilter = document.getElementById('attendance-class-filter');
            const classes = ['all', ...new Set((db.students || []).map(s => s.class))];
            let options = '';
            for (const c of classes) {
                options += `<option value="${c}">${c.charAt(0).toUpperCase() + c.slice(1)}</option>`;
            }
            classFilter.innerHTML = options;
        }
        
        function renderAttendanceTable() {
            const attendanceTableBody = document.getElementById('attendance-table-body');
            const date = document.getElementById('attendance-date').value;
            const selectedClass = document.getElementById('attendance-class-filter').value;

            if (!db.attendance) db.attendance = { students: {} };
            if (!db.attendance.students) db.attendance.students = {};
            if (!db.attendance.students[date]) db.attendance.students[date] = {};

            let html = '';
            for (const student of (db.students || [])) {
                if (selectedClass === 'all' || student.class === selectedClass) {
                    const attendanceStatus = db.attendance.students[date][student.roll] || 'Not Marked';
                    let statusDisplay;
                    switch (attendanceStatus) {
                        case 'present':
                            statusDisplay = '<span class="present-indicator">✔ Present</span>';
                            break;
                        case 'absent':
                            statusDisplay = '<span class="absent-indicator">✖ Absent</span>';
                            break;
                        default:
                            statusDisplay = 'Not Marked';
                    }

                    html += `
                        <tr>
                            <td>${student.name}</td>
                            <td>${student.roll}</td>
                            <td>${statusDisplay}</td>
                            <td>
                                <button class="btn btn-sm btn-success present-btn" data-roll="${student.roll}" data-date="${date}">Present</button>
                                <button class="btn btn-sm btn-danger absent-btn" data-roll="${student.roll}" data-date="${date}">Absent</button>
                            </td>
                        </tr>
                    `;
                }
            }
            attendanceTableBody.innerHTML = html;
        }

        function markAttendance(e) {
            const roll = e.target.dataset.roll;
            const date = e.target.dataset.date;
            if (e.target.classList.contains('present-btn')) {
                db.attendance.students[date][roll] = 'present';
                saveData();
            } else if (e.target.classList.contains('absent-btn')) {
                db.attendance.students[date][roll] = 'absent';
                saveData();
            }
        }

        function renderExamination() {
            const examinationContent = document.getElementById('examination');
            let content = `
                <div class="section-header">
                    <h2>Examination</h2>
                </div>
                <div class="examination-grid">
                    <div class="form-container">
                        <h3>Create Result Card</h3>
                        <form id="add-result-form">
                            <div class="form-grid">
                                <input type="text" id="result-student-roll" placeholder="Student Roll No." required>
                                <input type="text" id="result-exam-name" placeholder="Examination Name" required>
                                <input type="number" id="result-marks-english" placeholder="English Marks" required>
                                <input type="number" id="result-marks-math" placeholder="Math Marks" required>
                                <input type="number" id="result-marks-science" placeholder="Science Marks" required>
                                <input type="number" id="result-marks-urdu" placeholder="Urdu Marks" required>
                                <input type="number" id="result-marks-islamiyat" placeholder="Islamiyat Marks" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Generate Result Card</button>
                        </form>
                    </div>
                    <div class="table-container">
                        <h3>Saved Result Cards</h3>
                        <table id="results-table">
                            <thead>
                                <tr>
                                    <th>Student Name</th>
                                    <th>Roll No.</th>
                                    <th>Exam Name</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>`;
            examinationContent.innerHTML = content;
            renderResultsTable();

            document.getElementById('add-result-form').addEventListener('submit', saveResult);
            document.getElementById('results-table').addEventListener('click', viewResultCard);
        }

        function renderResultsTable() {
            const resultsTableBody = document.querySelector('#results-table tbody');
            let html = '';
            for (const [index, result] of (db.results || []).entries()) {
                const student = (db.students || []).find(s => s.roll === result.roll);
                const studentName = student ? student.name : 'N/A';
                html += `
                    <tr>
                        <td>${studentName}</td>
                        <td>${result.roll}</td>
                        <td>${result.examName}</td>
                        <td><button class="btn btn-sm btn-info view-result-btn" data-index="${index}">View</button></td>
                    </tr>`;
            }
            resultsTableBody.innerHTML = html;
        }

        function saveResult(e) {
            e.preventDefault();
            const newResult = {
                roll: document.getElementById('result-student-roll').value,
                examName: document.getElementById('result-exam-name').value,
                marks: {
                    english: parseFloat(document.getElementById('result-marks-english').value),
                    math: parseFloat(document.getElementById('result-marks-math').value),
                    science: parseFloat(document.getElementById('result-marks-science').value),
                    urdu: parseFloat(document.getElementById('result-marks-urdu').value),
                    islamiyat: parseFloat(document.getElementById('result-marks-islamiyat').value),
                }
            };
            if (!db.results) db.results = [];
            db.results.push(newResult);
            saveData();
            this.reset();
        }

        function viewResultCard(e) {
            if (e.target.classList.contains('view-result-btn')) {
                const index = e.target.dataset.index;
                openResultCardModal(index);
            }
        }

        function openResultCardModal(index) {
    const result = db.results[index];
    const student = (db.students || []).find(s => s.roll === result.roll);
    const modalContainer = document.getElementById('modal-container');
    let modalHtml = `<div class="modal" id="result-card-modal"><div class="modal-content"><div class="modal-header"><h3>Result Card</h3><span class="close-button">&times;</span></div>`;

    if (student) {
        const totalMarks = Object.values(result.marks).reduce((sum, mark) => sum + mark, 0);
        const percentage = (totalMarks / (Object.keys(result.marks).length * 100)) * 100;
        let grade;
        if (percentage >= 80) grade = 'A+';
        else if (percentage >= 70) grade = 'A';
        else if (percentage >= 60) grade = 'B';
        else if (percentage >= 50) grade = 'C';
        else if (percentage >= 40) grade = 'D';
        else grade = 'Fail';

        modalHtml += `
            <div class="result-card-content" id="result-card">
                <div class="result-card-header-new">
                    <img src="/Logo.png" alt="School Logo">
                    <h4>NATIONAL MODEL SCHOOL</h4>
                    <h5>${result.examName} Result Card</h5>
                </div>
                <div class="result-card-student-info">
                    <div><strong>Student Name:</strong> ${student.name}</div>
                    <div><strong>Father's Name:</strong> ${student.father || 'N/A'}</div>
                    <div><strong>Class:</strong> ${student.class}</div>
                    <div><strong>Roll No:</strong> ${student.roll}</div>
                </div>
                <table class="result-card-marks-table-new">
                    <thead><tr><th>Subject</th><th>Marks Obtained</th><th>Total Marks</th></tr></thead>
                    <tbody>
                        ${Object.keys(result.marks).map(subject => `<tr><td>${subject.charAt(0).toUpperCase() + subject.slice(1)}</td><td>${result.marks[subject]}</td><td>100</td></tr>`).join('')}
                    </tbody>
                </table>
                <div class="result-card-summary-new">
                    <div><strong>Total Marks:</strong> ${totalMarks} / ${Object.keys(result.marks).length * 100}</div>
                    <div><strong>Percentage:</strong> ${percentage.toFixed(2)}%</div>
                    <div><strong>Grade:</strong> ${grade}</div>
                </div>
            </div>
             <div class="modal-footer">
                <button id="print-result-card" class="btn btn-primary">Print</button>
            </div>`;
    } else {
        modalHtml += '<div style="padding:20px;">Student not found!</div>';
    }
    modalHtml += '</div></div>';
    modalContainer.innerHTML = modalHtml;

    const modal = document.getElementById('result-card-modal');
    modal.style.display = 'block';
    document.querySelector('#result-card-modal .close-button').addEventListener('click', () => modal.style.display = 'none');
    if (student) {
        document.getElementById('print-result-card').addEventListener('click', () => printResultCard());
    }
}

        function printResultCard() {
            const printContent = document.getElementById('result-card').innerHTML;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`<html><head><title>Print Result Card</title><link rel="stylesheet" href="/style.css"></head><body>${printContent}</body></html>`);
            printWindow.document.close();
            printWindow.print();
        }
        
        window.addEventListener('hashchange', () => navigate(window.location.hash));
        
        function initApp() {
            const hash = window.location.hash || '#dashboard';
            navigate(hash);
        }

        loadData().then(initApp);

    </script>
</body>
</html>
